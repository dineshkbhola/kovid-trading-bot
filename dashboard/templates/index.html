<!DOCTYPE html>
<html>
<head>
    <title>Kovid Trading Bot</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #0b1220;
            color: white;
        }

        .topbar {
            background: #111827;
            padding: 10px 20px;
            font-size: 14px;
            display: flex;
            gap: 20px;
        }

        .container {
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .card {
            background: #1f2937;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 0 10px rgba(0,0,0,0.4);
        }

        .title {
            font-size: 14px;
            color: #9ca3af;
        }

        .value {
            font-size: 28px;
            margin-top: 10px;
        }

        .signal {
            font-size: 32px;
            font-weight: bold;
        }

        .buy { color: #22c55e; }
        .sell { color: #ef4444; }
        .wait { color: #eab308; }

        .footer {
            margin-top: 30px;
            text-align: center;
            font-size: 12px;
            color: #6b7280;
        }
    </style>
</head>

<body>

<div class="topbar">
    NIFTY: {{ data.nifty }}
    CE: {{ data.ce }}
    PE: {{ data.pe }}
</div>

<div class="container">

    <h1>🚀 Kovid Trading Bot</h1>

    <div class="grid">

        <div class="card">
            <div class="title">NIFTY</div>
            <div class="value">{{ data.nifty }}</div>
        </div>

        <div class="card">
            <div class="title">CE PRICE</div>
            <div class="value">{{ data.ce }}</div>
        </div>

        <div class="card">
            <div class="title">PE PRICE</div>
            <div class="value">{{ data.pe }}</div>
        </div>

        <div class="card">
            <div class="title">SIGNAL</div>
            <div class="signal 
                {% if data.signal == 'BUY' %}buy
                {% elif data.signal == 'SELL' %}sell
                {% else %}wait{% endif %}">
                {{ data.signal }}
            </div>
        </div>

        <div class="card">
            <div class="title">ATM STRIKE</div>
            <div class="value">{{ data.atm }}</div>
        </div>

        <div class="card">
            <div class="title">STATUS</div>
            <div class="value">ACTIVE</div>
        </div>

    </div>

    <div class="footer">
        Last Updated: LIVE
    </div>

</div>

</body>
</html>
