<!DOCTYPE html>
<html>
<head>
    <title>KovidTradingBot Dashboard</title>
    <script>
        async function fetchData() {
            try {
                const res = await fetch("/data");
                const data = await res.json();

                document.getElementById("nifty").innerText = data.nifty || "-";
                document.getElementById("ce").innerText = data.ce || "-";
                document.getElementById("pe").innerText = data.pe || "-";
                document.getElementById("signal").innerText = data.signal || "-";
            } catch (e) {
                console.log("Error fetching data", e);
            }
        }

        setInterval(fetchData, 2000);
    </script>
</head>

<body style="font-family: Arial; background: #111; color: white; text-align:center;">

    <h1>🚀 Kovid Trading Bot</h1>

    <h2>NIFTY: <span id="nifty">-</span></h2>
    <h2>CE Price: <span id="ce">-</span></h2>
    <h2>PE Price: <span id="pe">-</span></h2>

    <h1 style="margin-top:30px;">
        SIGNAL: <span id="signal" style="color:yellow;">-</span>
    </h1>

</body>
</html>
