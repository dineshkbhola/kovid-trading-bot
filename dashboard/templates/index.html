<!DOCTYPE html>
<html>
<head>
    <title>KTB Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<!-- TOP BAR -->
<div class="topbar">
    <div class="logo">KTB</div>

    <div class="market">
        NIFTY: <span id="nifty">--</span>
        CE: <span id="ce">--</span>
        PE: <span id="pe">--</span>
    </div>

    <div class="status">LIVE</div>
</div>

<!-- MAIN -->
<div class="container">

    <h1>Kovid Trading Bot</h1>

    <div class="grid">

        <div class="card">
            <div class="title">NIFTY</div>
            <div id="nifty_card" class="value">--</div>
        </div>

        <div class="card">
            <div class="title">CE PRICE</div>
            <div id="ce_card" class="value">--</div>
        </div>

        <div class="card">
            <div class="title">PE PRICE</div>
            <div id="pe_card" class="value">--</div>
        </div>

        <div class="card big">
            <div class="title">LIVE SIGNAL</div>
            <div id="signal" class="signal">WAIT</div>
        </div>

        <div class="card">
            <div class="title">ATM STRIKE</div>
            <div id="atm" class="value">--</div>
        </div>

        <div class="card">
            <div class="title">STATUS</div>
            <div class="value green">ACTIVE</div>
        </div>

    </div>

</div>

<script src="/static/app.js"></script>

</body>
</html>
